name: Sync generated skills

# Pushes to main: regenerate and commit anything `make build` changes.
# Pull requests: check only (the action can't push to a contributor's branch).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate
        run: make build
      - name: Commit regenerated files
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate skills (make build)"
          git push
      - name: Check versions and generated files
        run: make check

  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generated files are up to date and versions match
        run: make check
