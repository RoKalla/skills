name: Release

# Push an annotated tag (git tag -a vX.Y.Z -F notes.md) to release.
# The release is created only if every check passes; its notes are the tag message.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch the annotated tag
        # checkout can leave a lightweight copy of the tag; fetch the real tag object
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: Tag is annotated and versioned
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag must look like v1.2.0"; exit 1; }
          [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ] || { echo "::error::Use an annotated tag: git tag -a $GITHUB_REF_NAME -F notes.md"; exit 1; }
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Tagged commit is not on main"; exit 1; }
      - name: Generated files are up to date and versions match the tag
        run: python3 scripts/build.py --check --expect "${GITHUB_REF_NAME#v}"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
